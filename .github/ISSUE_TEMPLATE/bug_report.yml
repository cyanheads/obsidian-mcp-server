name: Bug Report
description: Report a bug in obsidian-mcp-server
labels: ["bug"]
assignees: ["cyanheads"]
# The secondary labels listed below must exist in the repo — create each once: gh label create <name>
body:
  - type: markdown
    attributes:
      value: |
        **Server bug or framework bug?** File here if a tool returns wrong data, an upstream API call fails, a schema doesn't match reality, or a description misleads the model. If a builder rejects valid input, `createApp()` fails on a valid config, or transport or auth misbehaves regardless of which tool you call, file against [mcp-ts-core](https://github.com/cyanheads/mcp-ts-core/issues) instead. Not sure? File here and it'll get routed.

        **Do not include secrets, credentials, API keys, tokens, PII, or other sensitive data.** Redact env vars, auth headers, user-identifying information, and internal URLs from all code snippets, logs, and stack traces before submitting. GitHub issues are public and permanent.

        **Secondary labels.** `bug` is applied automatically — also add one or more of the following in the sidebar if they apply:
        - `regression` — worked before, broken after a change
        - `performance` — memory, CPU, latency, or resource usage
        - `security` — vulnerability, CVE, or hardening work
        - `breaking-change` — fix will break public API
        - `surplus-token-idea` — worth exploring when token budget allows

  - type: input
    id: version
    attributes:
      label: Server version
      placeholder: "3.5.2"
    validations:
      required: true

  - type: input
    id: framework-version
    attributes:
      label: mcp-ts-core version
      placeholder: "0.x.y"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Bun
        - Node.js
        - Cloudflare Workers
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      placeholder: "Bun 1.4.x / Node 24.x"
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - HTTP (Streamable HTTP)
        - Worker (Cloudflare)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15.x / Ubuntu 24.04 / etc."
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what you expected instead — two or three sentences.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact inputs, tool calls, or sequence of actions to trigger the bug.
      placeholder: |
        1. Call `tool_name` with input: `{ "key": "value" }`
        2. Observe error / wrong output
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Error messages, stack traces, or incorrect output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Only what changes the fix — a workaround, a related issue, the one log line that matters.
    validations:
      required: false
